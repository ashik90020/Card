<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #2980b9, #8e44ad);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-box {
      position: relative;
      width: 350px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      padding: 30px;
      color: #fff;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .inputbox {
      position: relative;
      margin: 20px 0;
      border-bottom: 2px solid #fff;
    }

    .inputbox input {
      width: 100%;
      padding: 10px 0;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
    }

    .inputbox label {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      font-size: 14px;
      pointer-events: none;
      transition: 0.3s;
    }

    .inputbox input:focus ~ label,
    .inputbox input:valid ~ label {
      top: -5px;
      font-size: 12px;
    }

    .inputbox ion-icon {
      position: absolute;
      right: 0;
      top: 10px;
    }

    .forget {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .forget a {
      color: #fff;
      text-decoration: none;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      background: #fff;
      color: #333;
      font-size: 16px;
      cursor: pointer;
    }

    .register {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .register a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<section>
  <div class="form-box">
    <div class="form-value">
      <form action="">
        <h2>Student Login</h2>

        <div class="inputbox">
          <ion-icon name="mail-outline"></ion-icon>
          <input type="text" required>
          <label>Username</label>
        </div>

        <div class="inputbox">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <input type="password" required>
          <label>Password</label>
        </div>

        <div class="forget">
          <label><input type="checkbox"> Remember Me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit">Log in</button>

        <div class="register">
          <p>Don't have an account? <a href="#">Register</a></p>
        </div>
      </form>
    </div>
  </div>
</section>

<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>
</html>
